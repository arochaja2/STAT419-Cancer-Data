name: Render and Release Report

on:
  push:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages and TinyTeX
        run: |
          Rscript -e "install.packages(c('MASS', 'rmarkdown', 'knitr', 'tinytex'), repos='https://cloud.r-project.org')"
          Rscript -e "tinytex::install_tinytex()"
          echo "$(Rscript -e 'cat(tinytex::tinytex_root())')/bin/x86_64-linux" >> $GITHUB_PATH

      - name: Render PDF
        run: quarto render report.qmd --to pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: report.pdf
          tag_name: ${{ github.sha }}
          name: "Report ${{ github.sha }}"
          body: "Auto-generated PDF for commit ${{ github.sha }}."
